<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiverScan — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --teal: #0ea5c9; --blue-light: #2e7dd1; --blue-dark: #0f2d5e;
            --gold: #f5c842; --white: #ffffff; --muted: rgba(255,255,255,0.55);
        }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(rgba(7,26,58,0.88), rgba(7,26,58,0.95)),
                url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1600&q=80')
                center/cover no-repeat fixed;
            color: var(--white);
        }
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 2.8rem 2.5rem;
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(12px);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-bottom: 1.8rem;
            text-decoration: none;
        }
        .logo-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--teal), var(--blue-light));
            border-radius: 12px;
            display: grid; place-items: center;
        }
        .logo span { font-size: 1.3rem; font-weight: 800; color: var(--white); }
        h2 { text-align: center; font-size: 1.6rem; font-weight: 800; margin-bottom: 0.4rem; }
        .sub { text-align: center; color: var(--muted); font-size: 0.88rem; margin-bottom: 2rem; }
        .field { margin-bottom: 1.2rem; }
        label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.05em; }
        input {
            width: 100%; padding: 13px 16px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px; color: var(--white);
            font-size: 0.95rem; font-family: 'Inter', sans-serif;
            outline: none; transition: border-color 0.2s;
        }
        input:focus { border-color: var(--teal); background: rgba(255,255,255,0.1); }
        input::placeholder { color: rgba(255,255,255,0.3); }
        .btn {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, var(--teal), var(--blue-light));
            border: none; border-radius: 12px;
            color: var(--white); font-size: 1rem; font-weight: 700;
            font-family: 'Inter', sans-serif; cursor: pointer;
            box-shadow: 0 6px 24px rgba(14,165,201,0.35);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 0.5rem;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(14,165,201,0.5); }
        .errors {
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.35);
            border-radius: 10px; padding: 10px 14px;
            color: #fca5a5; font-size: 0.85rem; margin-bottom: 1.2rem;
        }
        .footer-link { text-align: center; margin-top: 1.4rem; font-size: 0.85rem; color: var(--muted); }
        .footer-link a { color: var(--teal); text-decoration: none; font-weight: 600; }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <a href="/" class="logo">
            <div class="logo-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2C12 2 5 9.5 5 14a7 7 0 0 0 14 0C19 9.5 12 2 12 2Z" fill="url(#lg)"/>
                    <path d="M9 15.5c0 1.5 1.3 2.5 3 2.5" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
                    <defs>
                        <linearGradient id="lg" x1="12" y1="2" x2="12" y2="21" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#7ee8fa"/>
                            <stop offset="100%" stop-color="#0ea5c9"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <span>RiverScan</span>
        </a>

        <h2>Welcome back</h2>
        <p class="sub">Sign in to access river analysis</p>

        {% if errors %}
        <div class="errors">⚠️ Invalid username or password.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="/home/">
            <div class="field">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username" autofocus>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password">
            </div>
            <button type="submit" class="btn">Sign In →</button>
        </form>

        <div class="footer-link">
            Don't have an account? <a href="/register/">Register</a>
        </div>
    </div>
</body>
</html>
