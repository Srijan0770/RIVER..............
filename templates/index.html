<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>River Water pH Analysis</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            margin: 0;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 92%;
            max-width: 900px;
            background: rgba(255,255,255,0.1);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; margin-top: 0; }
        .row { display: flex; gap: 10px; margin-bottom: 20px; }
        input {
            flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 16px;
        }
        button {
            padding: 12px 20px; border: none; border-radius: 10px;
            background: #00c6ff; cursor: pointer; font-weight: bold;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px; margin-bottom: 20px;
        }
        .card {
            background: rgba(255,255,255,0.12);
            padding: 15px; border-radius: 12px; text-align: center;
        }
        table {
            width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.06);
        }
        th, td {
            padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.15); text-align: center;
        }
        .msg { margin: 10px 0; color: #ffd166; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌊 River Water pH Analysis</h1>
        <div class="row">
            <input id="river" type="text" placeholder="Enter river name">
            <button onclick="checkRiver()">Analyze</button>
        </div>

        <div class="msg" id="message"></div>

        <div class="cards">
            <div class="card"><strong>Average pH</strong><div id="avg_ph">--</div></div>
            <div class="card"><strong>Minimum pH</strong><div id="min_ph">--</div></div>
            <div class="card"><strong>Maximum pH</strong><div id="max_ph">--</div></div>
            <div class="card"><strong>River</strong><div id="river_name">--</div></div>
        </div>

        <table id="table">
            <tr><th>City</th><th>pH</th><th>Status</th></tr>
        </table>
    </div>

    <script>
        function checkRiver() {
            const river = document.getElementById("river").value.trim();
            const message = document.getElementById("message");
            const table = document.getElementById("table");

            if (!river) {
                message.textContent = "Please enter a river name.";
                return;
            }

            fetch(`/analyze/?river=${encodeURIComponent(river)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.error) {
                        message.textContent = data.error;
                        table.innerHTML = "<tr><th>City</th><th>pH</th><th>Status</th></tr>";
                        document.getElementById("avg_ph").textContent = "--";
                        document.getElementById("min_ph").textContent = "--";
                        document.getElementById("max_ph").textContent = "--";
                        document.getElementById("river_name").textContent = "--";
                        return;
                    }

                    message.textContent = "Analysis completed successfully.";
                    document.getElementById("avg_ph").textContent = data.avg_ph;
                    document.getElementById("min_ph").textContent = data.min_ph;
                    document.getElementById("max_ph").textContent = data.max_ph;
                    document.getElementById("river_name").textContent = data.river;

                    table.innerHTML = "<tr><th>City</th><th>pH</th><th>Status</th></tr>";
                    data.data.forEach(row => {
                        table.innerHTML += `<tr><td>${row.city}</td><td>${row.ph}</td><td>${row.quality}</td></tr>`;
                    });
                })
                .catch(() => {
                    message.textContent = "Server error. Make sure Django is running.";
                });
        }
    </script>
</body>
</html>
